<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" width="1040" height="540" font-family="'Noto Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Helvetica, Arial, sans-serif">
  <rect width="1040" height="540" fill="#ffffff"/>

  <text x="24" y="38" font-size="20" font-weight="600" fill="#1f2328">แต่ละโจทย์แก้ด้วยวิธีไหน</text>
  <text x="24" y="62" font-size="14" fill="#636c76">ไม่ใช่ทุกโจทย์ที่ต้องใช้ neural network ในนี้มีสองตัวที่ไม่ได้ใช้</text>

  <!-- column 1: no model -->
  <rect x="24" y="90" width="310" height="420" rx="8" fill="#fff8f2" stroke="#ffd8b5"/>
  <text x="46" y="122" font-size="16" font-weight="600" fill="#bc4c00">ไม่ใช้โมเดล</text>
  <text x="46" y="144" font-size="12.5" fill="#8c6a4f">ผมเขียนกฎเอง คอมพิวเตอร์ดูแค่</text>
  <text x="46" y="161" font-size="12.5" fill="#8c6a4f">สี ขอบ และรูปทรงเท่านั้น</text>

  <rect x="46" y="182" width="266" height="86" rx="6" fill="#ffffff" stroke="#ffd8b5"/>
  <text x="62" y="206" font-size="13.5" font-weight="600" fill="#1f2328">cane_on_truck</text>
  <text x="62" y="226" font-size="12" fill="#636c76">รถมีอ้อยหรือว่างเปล่า</text>
  <text x="62" y="244" font-size="12" fill="#636c76">ดูแค่ขอบกับการเคลื่อนไหว</text>
  <text x="62" y="260" font-size="11.5" fill="#bc4c00">3.9 ms ต่อเฟรม ไม่ใช้ GPU</text>

  <rect x="46" y="284" width="266" height="86" rx="6" fill="#ffffff" stroke="#ffd8b5"/>
  <text x="62" y="308" font-size="13.5" font-weight="600" fill="#1f2328">burn_mixing</text>
  <text x="62" y="328" font-size="12" fill="#636c76">มีอ้อยไฟไหม้ปนมาเท่าไร</text>
  <text x="62" y="346" font-size="12" fill="#636c76">นับลำที่สีสว่างจากค่าสี</text>
  <text x="62" y="362" font-size="11.5" fill="#bc4c00">พิกเซลสว่างแยกได้ต่างกัน 3 เท่า</text>

  <text x="46" y="404" font-size="12.5" fill="#8c6a4f">ทำไมหยุดแค่นี้ เพราะมันใช้ได้แล้ว</text>
  <text x="46" y="422" font-size="12.5" fill="#8c6a4f">เร็วด้วย และผมอธิบายได้ทุกขั้น</text>
  <text x="46" y="440" font-size="12.5" fill="#8c6a4f">ให้คนหน้างานในโรงงานฟัง</text>

  <!-- column 2: model + rule -->
  <rect x="358" y="90" width="310" height="420" rx="8" fill="#f2f9ff" stroke="#b6e3ff"/>
  <text x="380" y="122" font-size="16" font-weight="600" fill="#0969da">โมเดล บวกกฎ</text>
  <text x="380" y="144" font-size="12.5" fill="#4a7ba7">โมเดลตอบมา แล้วกฎที่ผมเขียน</text>
  <text x="380" y="161" font-size="12.5" fill="#4a7ba7">มีสิทธิ์โยนคำตอบนั้นทิ้ง</text>

  <rect x="380" y="182" width="266" height="86" rx="6" fill="#ffffff" stroke="#b6e3ff"/>
  <text x="396" y="206" font-size="13.5" font-weight="600" fill="#1f2328">dust_opacity</text>
  <text x="396" y="226" font-size="12" fill="#636c76">กลุ่มฝุ่นหนาแค่ไหน</text>
  <text x="396" y="244" font-size="12" fill="#636c76">กฎถามว่า นี่ฝุ่นลอยจริงไหม</text>
  <text x="396" y="260" font-size="11.5" fill="#0969da">กันแจ้งเตือนผิดจากกองอ้อยสีเข้ม</text>

  <rect x="380" y="284" width="266" height="86" rx="6" fill="#ffffff" stroke="#b6e3ff"/>
  <text x="396" y="308" font-size="13.5" font-weight="600" fill="#1f2328">plate_ocr</text>
  <text x="396" y="328" font-size="12" fill="#636c76">อ่านเลขบนป้ายทะเบียน</text>
  <text x="396" y="346" font-size="12" fill="#636c76">มีสองตัวอ่าน ตัวหนึ่งไม่ใช้โมเดล</text>
  <text x="396" y="362" font-size="11.5" fill="#0969da">ตอบ 51 จาก 60 ผิด 0</text>

  <text x="380" y="404" font-size="12.5" fill="#4a7ba7">ทำไมต้องทำ เพราะโมเดลที่มั่นใจ</text>
  <text x="380" y="422" font-size="12.5" fill="#4a7ba7">แล้วผิด แพงกว่าโมเดลที่ยอมบอก</text>
  <text x="380" y="440" font-size="12.5" fill="#4a7ba7">ว่าไม่รู้</text>

  <!-- column 3: trained model -->
  <rect x="692" y="90" width="324" height="420" rx="8" fill="#f2fbf5" stroke="#aceebb"/>
  <text x="714" y="122" font-size="16" font-weight="600" fill="#1a7f37">โมเดลที่เทรนมา</text>
  <text x="714" y="144" font-size="12.5" fill="#4a8a5e">ผมป้อนตัวอย่างเยอะ ๆ ให้ดู</text>
  <text x="714" y="161" font-size="12.5" fill="#4a8a5e">แล้วมันเรียนรู้แพตเทิร์นเอง</text>

  <rect x="714" y="182" width="280" height="64" rx="6" fill="#ffffff" stroke="#aceebb"/>
  <text x="730" y="204" font-size="13.5" font-weight="600" fill="#1f2328">burnt_classifier</text>
  <text x="730" y="223" font-size="12" fill="#636c76">อ้อยไฟไหม้หรืออ้อยสด</text>
  <text x="730" y="239" font-size="11.5" fill="#1a7f37">ภาพจริงจากโรงงาน 8,612 ภาพ</text>

  <rect x="714" y="258" width="280" height="64" rx="6" fill="#ffffff" stroke="#aceebb"/>
  <text x="730" y="280" font-size="13.5" font-weight="600" fill="#1f2328">acoustic</text>
  <text x="730" y="299" font-size="12" fill="#636c76">ฟังเสียงทราย หิน เหล็ก</text>
  <text x="730" y="315" font-size="11.5" fill="#1a7f37">ทราย เจอ 94% ไม่มีแจ้งผิดเลย</text>

  <rect x="714" y="334" width="280" height="64" rx="6" fill="#ffffff" stroke="#aceebb"/>
  <text x="730" y="356" font-size="13.5" font-weight="600" fill="#1f2328">cane_flow</text>
  <text x="730" y="375" font-size="12" fill="#636c76">บนสายพานมีใบเท่าไร</text>
  <text x="730" y="391" font-size="11.5" fill="#1a7f37">70 เฟรมต่อวินาที แบบสด</text>

  <rect x="714" y="410" width="280" height="64" rx="6" fill="#ffffff" stroke="#aceebb"/>
  <text x="730" y="432" font-size="13.5" font-weight="600" fill="#1f2328">dirty_area · stalk_seg</text>
  <text x="730" y="451" font-size="12" fill="#636c76">ตีเส้นดิน เศษใบ และลำอ้อย</text>
  <text x="730" y="467" font-size="11.5" fill="#1a7f37">ตอนนี้ label ยังน้อยไป บอกตรง ๆ</text>
</svg>
