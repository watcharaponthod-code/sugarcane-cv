<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1040" height="500" fill="#ffffff"/>

  <text x="24" y="38" font-size="20" font-weight="600" fill="#1f2328">Where each detector runs</text>
  <text x="24" y="62" font-size="14" fill="#636c76">One truck, three stations, nine problems.</text>

  <!-- flow arrow -->
  <line x1="60" y1="120" x2="980" y2="120" stroke="#d0d7de" stroke-width="2"/>
  <polygon points="980,120 968,114 968,126" fill="#d0d7de"/>
  <text x="60" y="108" font-size="12" fill="#8c959f">truck arrives</text>
  <text x="900" y="108" font-size="12" fill="#8c959f">into the mill</text>

  <!-- station 1 -->
  <circle cx="180" cy="120" r="7" fill="#0969da"/>
  <rect x="60" y="160" width="250" height="190" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="80" y="188" font-size="15" font-weight="600" fill="#1f2328">1. Weighbridge</text>
  <text x="80" y="208" font-size="12" fill="#636c76">Cameras at the gate.</text>

  <text x="80" y="240" font-size="13" fill="#1f2328">Read the plate</text>
  <text x="80" y="258" font-size="11.5" fill="#8c959f">plate_ocr</text>
  <rect x="236" y="228" width="56" height="18" rx="9" fill="#ddf4ff"/>
  <text x="264" y="241" font-size="10.5" fill="#0969da" text-anchor="middle">both</text>

  <text x="80" y="290" font-size="13" fill="#1f2328">Loaded or empty?</text>
  <text x="80" y="308" font-size="11.5" fill="#8c959f">cane_on_truck</text>
  <rect x="216" y="278" width="76" height="18" rx="9" fill="#fff1e5"/>
  <text x="254" y="291" font-size="10.5" fill="#bc4c00" text-anchor="middle">no model</text>

  <!-- station 2 -->
  <circle cx="520" cy="120" r="7" fill="#0969da"/>
  <rect x="345" y="160" width="350" height="280" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="365" y="188" font-size="15" font-weight="600" fill="#1f2328">2. Side tippler</text>
  <text x="365" y="208" font-size="12" fill="#636c76">The truck tips. Dust flies. Cane falls.</text>

  <text x="365" y="240" font-size="13" fill="#1f2328">How thick is the dust?</text>
  <text x="365" y="258" font-size="11.5" fill="#8c959f">dust_opacity</text>
  <rect x="588" y="228" width="87" height="18" rx="9" fill="#dafbe1"/>
  <text x="631" y="241" font-size="10.5" fill="#1a7f37" text-anchor="middle">model + rule</text>

  <text x="365" y="288" font-size="13" fill="#1f2328">Burnt cane or fresh?</text>
  <text x="365" y="306" font-size="11.5" fill="#8c959f">burnt_classifier</text>
  <rect x="611" y="276" width="64" height="18" rx="9" fill="#dafbe1"/>
  <text x="643" y="289" font-size="10.5" fill="#1a7f37" text-anchor="middle">model</text>

  <text x="365" y="336" font-size="13" fill="#1f2328">How much burnt is mixed in?</text>
  <text x="365" y="354" font-size="11.5" fill="#8c959f">burn_mixing</text>
  <rect x="599" y="324" width="76" height="18" rx="9" fill="#fff1e5"/>
  <text x="637" y="337" font-size="10.5" fill="#bc4c00" text-anchor="middle">no model</text>

  <text x="365" y="384" font-size="13" fill="#1f2328">How much is soil and trash?</text>
  <text x="365" y="402" font-size="11.5" fill="#8c959f">dirty_area</text>
  <rect x="611" y="372" width="64" height="18" rx="9" fill="#dafbe1"/>
  <text x="643" y="385" font-size="10.5" fill="#1a7f37" text-anchor="middle">model</text>

  <text x="365" y="426" font-size="13" fill="#1f2328">Sand, rock or metal? (microphone)</text>
  <rect x="611" y="414" width="64" height="18" rx="9" fill="#dafbe1"/>
  <text x="643" y="427" font-size="10.5" fill="#1a7f37" text-anchor="middle">model</text>
  <text x="365" y="444" font-size="11.5" fill="#8c959f">acoustic</text>

  <!-- station 3 -->
  <circle cx="860" cy="120" r="7" fill="#0969da"/>
  <rect x="730" y="160" width="250" height="190" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="750" y="188" font-size="15" font-weight="600" fill="#1f2328">3. Carrier</text>
  <text x="750" y="208" font-size="12" fill="#636c76">The belt never stops.</text>

  <text x="750" y="240" font-size="13" fill="#1f2328">How much is leaf?</text>
  <text x="750" y="258" font-size="11.5" fill="#8c959f">cane_flow</text>
  <rect x="898" y="228" width="64" height="18" rx="9" fill="#dafbe1"/>
  <text x="930" y="241" font-size="10.5" fill="#1a7f37" text-anchor="middle">model</text>

  <text x="750" y="290" font-size="13" fill="#1f2328">Outline one stalk</text>
  <text x="750" y="308" font-size="11.5" fill="#8c959f">stalk_seg</text>
  <rect x="898" y="278" width="64" height="18" rx="9" fill="#dafbe1"/>
  <text x="930" y="291" font-size="10.5" fill="#1a7f37" text-anchor="middle">model</text>
  <text x="750" y="330" font-size="11" fill="#8c959f">supports the other detectors</text>

  <!-- legend -->
  <rect x="60" y="462" width="14" height="14" rx="7" fill="#fff1e5"/>
  <text x="82" y="474" font-size="12" fill="#636c76">no model, plain image processing</text>
  <rect x="330" y="462" width="14" height="14" rx="7" fill="#dafbe1"/>
  <text x="352" y="474" font-size="12" fill="#636c76">trained model</text>
  <rect x="500" y="462" width="14" height="14" rx="7" fill="#ddf4ff"/>
  <text x="522" y="474" font-size="12" fill="#636c76">both, built side by side</text>
</svg>
